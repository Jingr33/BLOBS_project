name: Build Windows EXE

on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to build'
        required: false
        default: 'main'

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    runs-on: windows-latest

    permissions:
      contents: write   # needed if you attach the exe to a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.pull_request.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Blobs src/blobs_project/__main__.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-windows-${{ github.sha }}
          path: dist/MyApp.exe
          if-no-files-found: error
          retention-days: 90
